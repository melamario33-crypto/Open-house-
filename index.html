<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open House – Mario Mela | RE/MAX Aequitas</title>
<link rel="apple-touch-icon" href="logo-remax.jpg">
<link rel="icon" type="image/png" href="logo-remax.jpg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#DC1B27;--blue:#003DA5;--light:#f5f6f8;--border:#e2e4ea;--text:#1a1a2e;--muted:#6b7280;--success:#16a34a;--success-bg:#f0fdf4}
body{font-family:'Open Sans',sans-serif;background:var(--light);color:var(--text);min-height:100vh}
.header{background:var(--blue);position:relative}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--red)}
.header-inner{max-width:680px;margin:0 auto;padding:1.75rem 1.5rem;display:flex;align-items:center;gap:1.25rem}
.logo-img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.2);background:white}
.header-text h1{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;color:rgba(255,255,255,0.6);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:3px}
.header-text h2{font-family:'Montserrat',sans-serif;font-size:21px;font-weight:800;color:white}
.header-text p{font-size:13px;color:rgba(255,255,255,0.65);margin-top:3px}
.main{max-width:680px;margin:0 auto;padding:1.5rem 1.5rem 3rem}
.card{background:white;border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.25rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.full{grid-template-columns:1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.form-group input,.form-group select,.form-group textarea{padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:'Open Sans',sans-serif;color:var(--text);background:white;outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue)}
.form-group textarea{resize:vertical;min-height:75px}
.btn{display:block;width:100%;padding:13px 20px;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .15s;text-align:center}
.btn-blue{background:var(--blue);color:white}
.btn-blue:hover{background:#002d7a}
.btn-red{background:var(--red);color:white}
.btn-red:hover{background:#b81522}
.btn-red:disabled{background:#ccc;cursor:not-allowed}
.link-box{background:#EEF2FF;border:1.5px solid var(--blue);border-radius:10px;padding:1rem 1.25rem;margin-top:1rem}
.link-box .lbl{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.link-url{font-size:12px;color:#003DA5;word-break:break-all;line-height:1.6;margin-bottom:10px;font-family:monospace;background:white;border:1px solid #c7d3f5;border-radius:6px;padding:8px 10px}
.link-actions{display:flex;gap:8px}
.btn-copy{padding:9px 16px;border-radius:6px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;cursor:pointer;background:var(--blue);color:white;border:none}
.btn-prev{padding:9px 16px;border-radius:6px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;cursor:pointer;background:white;color:var(--blue);border:1.5px solid var(--blue)}
.slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.slot-btn{padding:10px 6px;border:1.5px solid var(--border);border-radius:8px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;cursor:pointer;background:white;color:var(--text);text-align:center;transition:all .15s}
.slot-btn:hover{border-color:var(--blue);color:var(--blue);background:#EEF2FF}
.slot-btn.selected{background:var(--blue);border-color:var(--blue);color:white}
.slot-btn.booked{background:#FFF5F5;border-color:#FCA5A5;color:var(--red);cursor:default;font-size:11px;line-height:1.3;padding:6px 4px}
.slot-btn.booked .t{display:block;font-size:12px;font-weight:700}
.slot-btn.booked .nd{display:block;font-size:9px;margin:1px 0}
.slot-btn.booked .rq{display:block;font-size:9px;color:var(--blue);text-decoration:underline;cursor:pointer;margin-top:2px}
.steps{display:flex;gap:8px;align-items:center;margin-bottom:1.25rem}
.step{display:flex;align-items:center;gap:6px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;color:var(--muted)}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.step.active .step-num{background:var(--blue);color:white}
.step.active{color:var(--blue)}
.step.done .step-num{background:var(--success);color:white}
.step-line{flex:1;height:1px;background:var(--border)}
.slot-badge{display:none;background:#EEF2FF;border:1.5px solid var(--blue);border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;color:var(--blue)}
.property-banner{background:white;border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:12px}
.prop-icon{width:40px;height:40px;background:#EEF2FF;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prop-icon svg{width:20px;height:20px;color:var(--blue)}
.prop-info .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:600}
.prop-info .addr{font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:var(--text);margin-top:2px}
.prop-info .dt{font-size:13px;color:var(--muted);margin-top:3px}
.prop-badge{background:var(--red);color:white;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-left:auto;white-space:nowrap}
.success-card{display:none;background:var(--success-bg);border:1.5px solid #86efac;border-radius:12px;padding:2rem;text-align:center;margin-bottom:1.25rem}
.success-icon{width:56px;height:56px;background:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
.success-icon svg{width:28px;height:28px;color:white}
.success-card h3{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;color:var(--success);margin-bottom:8px}
.success-card p{font-size:14px;color:#166534;line-height:1.6}
.admin-box{border:2px dashed #c7d3f5;border-radius:12px;padding:1.5rem;margin-bottom:1.25rem;background:white}
.admin-title{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.admin-badge{background:var(--blue);color:white;font-size:10px;padding:2px 8px;border-radius:20px;letter-spacing:0;text-transform:none;font-weight:600}
.section-label{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.footer{text-align:center;padding:1.5rem;font-size:12px;color:var(--muted);border-top:1px solid var(--border);max-width:680px;margin:0 auto}
.footer strong{color:var(--blue)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:white;padding:10px 20px;border-radius:8px;font-size:13px;font-family:'Montserrat',sans-serif;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
.empty-state svg{display:block;margin:0 auto 1rem;opacity:.25}
.empty-state p{font-size:14px;font-weight:600;font-family:'Montserrat',sans-serif;line-height:1.5}
.contact-bar{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.cbar-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;cursor:pointer;border:none;text-decoration:none;transition:all .15s;flex:1;justify-content:center;white-space:nowrap}
.cbar-btn.phone{background:var(--blue);color:white}
.cbar-btn.phone:hover{background:#002d7a}
.cbar-btn.whatsapp{background:#25D366;color:white}
.cbar-btn.whatsapp:hover{background:#1da851}
.cbar-btn.instagram{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:white}
.cbar-btn.instagram:hover{opacity:.9}
.cbar-btn.facebook{background:#1877F2;color:white}
.cbar-btn.facebook:hover{background:#0d65d9}
@media(max-width:480px){.cbar-btn{flex:calc(50% - 4px);min-width:calc(50% - 4px)}}
.privacy-box{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
.privacy-box input[type=checkbox]{margin-top:3px;flex-shrink:0;width:16px;height:16px;cursor:pointer}
.privacy-box span{font-size:12px;color:var(--muted);line-height:1.5}
.privacy-box a{color:var(--blue);text-decoration:underline}
@media(max-width:520px){.form-row{grid-template-columns:1fr}.form-row.three{grid-template-columns:1fr 1fr}.header-text h2{font-size:17px}.prop-badge{display:none}.steps span{display:none}}
.contact-card{max-width:680px;margin:0 auto 1.5rem;padding:0 1.5rem}
.contact-inner{background:white;border:1px solid var(--border);border-radius:12px;padding:1.25rem;display:flex;align-items:center;gap:1rem}
.contact-photo{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--border);flex-shrink:0}
.contact-info{flex:1}
.contact-info .name{font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px;color:var(--text)}
.contact-info .role{font-size:12px;color:var(--muted);margin-top:2px}
.contact-info .agency{font-size:12px;color:var(--blue);font-weight:600;margin-top:1px}
.contact-btns{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.btn-call{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;cursor:pointer;border:none;text-decoration:none;transition:all .15s}
.btn-call.phone{background:var(--blue);color:white}
.btn-call.phone:hover{background:#002d7a}
.btn-call.whatsapp{background:#25D366;color:white}
.btn-call.whatsapp:hover{background:#1da851}
.btn-call.instagram{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:white}
.btn-call.instagram:hover{opacity:.9}
.btn-call.facebook{background:#1877F2;color:white}
.btn-call.facebook:hover{background:#0d65d9}
@media(max-width:480px){.contact-inner{flex-wrap:wrap}.contact-btns{flex-direction:row;flex-wrap:wrap;width:100%}.btn-call{flex:1;min-width:calc(50% - 4px);justify-content:center}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <img class="logo-img" src="logo-remax.jpg" alt="RE/MAX Aequitas">
    <div class="header-text">
      <h1>RE/MAX Aequitas</h1>
      <h2>Mario Mela</h2>
      <p>Agente Immobiliare – Prenotazione Open House</p>
    </div>
  </div>
</div>
<div class="main" id="app"></div>
<div id="contact-card-wrapper"></div>
<div class="footer"><strong>Mario Mela</strong> · RE/MAX Aequitas · Agente Immobiliare<br>Per assistenza contatta direttamente l'agente</div>
<div class="toast" id="toast"></div>
<script>
document.addEventListener("DOMContentLoaded",function(){

const params=new URLSearchParams(window.location.search);
const dateParam=params.get('date');
const startParam=params.get('start');
const endParam=params.get('end');
const addressParam=params.get('address')?decodeURIComponent(params.get('address')):'';
const isClient=!!(dateParam&&startParam&&endParam);
let selectedSlot=null;
let bookedSlots=[];
const WEB3_KEY='0eae95be-ab3e-4b94-86b3-2a16537598c7';
const KV_BASE='https://kvdb.io/9mMPd7E1VhJqmMrGJmcgUe/';
const STORE_KEY='oh_'+(dateParam||'')+'_'+(addressParam||'').replace(/[^a-z0-9]/gi,'').substring(0,15);

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

async function loadBookedSlots(){
  try{
    const res=await fetch(KV_BASE+encodeURIComponent(STORE_KEY));
    if(res.ok){const txt=await res.text();if(txt&&txt!=='null'&&txt!=='')bookedSlots=JSON.parse(txt);}
  }catch(e){}
  updateSlotUI();
}

async function saveBookedSlots(){
  try{
    await fetch(KV_BASE+encodeURIComponent(STORE_KEY),{method:'POST',body:JSON.stringify(bookedSlots)});
  }catch(e){}
}

function updateSlotUI(){
  const btns=document.querySelectorAll('.slot-btn');
  btns.forEach(btn=>{
    const s=btn.dataset.slot;
    if(s&&bookedSlots.includes(s)&&!btn.classList.contains('booked')){
      btn.classList.add('booked');
      btn.classList.remove('selected');
      btn.innerHTML='<span class="t">'+s+'</span><span class="nd">Non disponibile</span><span class="rq" onclick="requestSlot(\''+s+'\',event)">Richiedi →</span>';
    }
  });
}

async function requestSlot(slot,event){
  event.stopPropagation();
  const name=prompt('Il tuo nome e cognome:');
  if(!name||!name.trim())return;
  const phone=prompt('Il tuo numero di telefono:');
  if(!phone||!phone.trim())return;
  try{
    const d=new Date(dateParam+'T00:00:00');
    const ds=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const fd=new FormData();
    fd.append('access_key',WEB3_KEY);
    fd.append('subject','⚠️ Richiesta slot occupato – '+slot+' – '+name);
    fd.append('from_name',name);
    fd.append('Nome',name);
    fd.append('Telefono',phone);
    fd.append('Orario_richiesto',slot);
    fd.append('Data',ds);
    fd.append('Immobile',addressParam||'–');
    await fetch('https://api.web3forms.com/submit',{method:'POST',body:fd});
    alert('✅ Richiesta inviata! Mario Mela ti contatterà al più presto.');
  }catch(e){alert('Errore. Riprova.');}
}

function generateSlots(start,end){
  const slots=[];
  let[h,m]=start.split(':').map(Number);
  const[eh,em]=end.split(':').map(Number);
  while(h*60+m<eh*60+em){slots.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));m+=15;if(m>=60){h++;m-=60;}}
  return slots;
}

// ── ADMIN ──
function renderAdmin(){
  document.getElementById('app').innerHTML=`
  <div class="admin-box">
    <div class="admin-title">⚙ Pannello agente <span class="admin-badge">solo tu vedi questo</span></div>
    <div class="form-row three" style="margin-bottom:12px">
      <div class="form-group"><label>Data open house *</label><input type="date" id="ev-date"></div>
      <div class="form-group"><label>Orario inizio *</label><input type="time" id="ev-start" value="10:00"></div>
      <div class="form-group"><label>Orario fine *</label><input type="time" id="ev-end" value="13:00"></div>
    </div>
    <div class="form-row" style="margin-bottom:16px">
      <div class="form-group"><label>Indirizzo immobile *</label><input type="text" id="ev-address" placeholder="es. Via Roma 12, Pesaro"></div>
      <div class="form-group"><label>Tua email</label><div style="background:#DCFCE7;border:1.5px solid #86efac;border-radius:8px;padding:10px 12px;font-size:13px;color:#166534;">✓ Le prenotazioni arrivano automaticamente alla tua email</div></div>
    </div>
    <button class="btn btn-blue" onclick="makeLink()">Genera link da condividere ai clienti →</button>
    <div id="link-result"></div>
  </div>

  <!-- SEZIONE PROMEMORIA PRENOTAZIONI -->
  <div class="card" id="bookings-section" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <div style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:var(--text)">📋 Prenotazioni ricevute</div>
      <button onclick="refreshBookings()" style="background:#EEF2FF;border:1.5px solid var(--blue);color:var(--blue);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Montserrat',sans-serif">↻ Aggiorna</button>
    </div>
    <div id="bookings-list"><p style="font-size:13px;color:var(--muted);text-align:center;padding:1rem 0">Caricamento...</p></div>
  </div>

  <div class="empty-state" id="empty-state-box">
    <svg width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
    <p>Inserisci i dati dell'open house<br>e genera il link per i tuoi clienti</p>
  </div>`;
}

async function loadBookingsForAdmin(date, address){
  const storeKey='oh_'+date+'_'+(address||'').replace(/[^a-z0-9]/gi,'').substring(0,15);
  const clientsKey=storeKey+'_clients';
  try{
    const res=await fetch(KV_BASE+encodeURIComponent(clientsKey));
    if(res.ok){
      const txt=await res.text();
      const clients=(txt&&txt!=='null'&&txt!=='')?JSON.parse(txt):[];
      renderBookingsList(clients);
    } else {
      renderBookingsList([]);
    }
  }catch(e){renderBookingsList([]);}
}

function renderBookingsList(clients){
  const el=document.getElementById('bookings-list');
  if(!clients||clients.length===0){
    el.innerHTML='<p style="font-size:13px;color:var(--muted);text-align:center;padding:1rem 0">Nessuna prenotazione ancora ricevuta.</p>';
    return;
  }
  // Ordina per slot
  clients.sort((a,b)=>a.slot.localeCompare(b.slot));
  el.innerHTML=clients.map((c,i)=>`
    <div style="border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;background:${i%2===0?'#fafafa':'white'}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="background:var(--blue);color:white;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;padding:2px 8px;border-radius:4px">${c.slot}</span>
        <span style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;color:var(--text)">${c.name}</span>
        <span style="font-size:11px;color:var(--muted);margin-left:auto">${c.people||'1'} pers.</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">
        <div style="font-size:12px;color:var(--muted)">📞 <a href="tel:${c.phone}" style="color:var(--blue);text-decoration:none">${c.phone}</a></div>
        <div style="font-size:12px;color:var(--muted)">✉️ <a href="mailto:${c.email}" style="color:var(--blue);text-decoration:none">${c.email}</a></div>
      </div>
      ${c.notes?`<div style="margin-top:6px;font-size:12px;color:#555;background:#f5f5f5;border-radius:5px;padding:5px 8px">💬 ${c.notes}</div>`:''}
    </div>
  `).join('');
}

async function refreshBookings(){
  const date=document.getElementById('ev-date').value;
  const address=(document.getElementById('ev-address').value||'').trim();
  if(!date){showToast('Inserisci prima la data');return;}
  document.getElementById('bookings-list').innerHTML='<p style="font-size:13px;color:var(--muted);text-align:center;padding:1rem 0">Caricamento...</p>';
  await loadBookingsForAdmin(date,address);
}

function makeLink(){
  const date=document.getElementById('ev-date').value;
  const start=document.getElementById('ev-start').value;
  const end=document.getElementById('ev-end').value;
  const address=document.getElementById('ev-address').value.trim();
  if(!date||!start||!end||!address){alert('Compila almeno data, orari e indirizzo.');return;}
  if(start>=end){alert("L'orario di fine deve essere dopo quello di inizio.");return;}
  const base=window.location.href.split('?')[0];
  const link=base+'?date='+date+'&start='+encodeURIComponent(start)+'&end='+encodeURIComponent(end)+'&address='+encodeURIComponent(address);
  const d=new Date(date+'T00:00:00');
  const ds=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('link-result').innerHTML=`
  <div class="link-box">
    <div class="lbl">Link per i clienti — ${ds}</div>
    <div class="link-url" id="gen-link">${link}</div>
    <div class="link-actions">
      <button class="btn-copy" onclick="copyLink()">📋 Copia link</button>
      <button class="btn-prev" onclick="window.open('${link.replace(/'/g,"\\'")}','_blank')">👁 Anteprima</button>
    </div>
  </div>`;
  document.getElementById('link-result').dataset.link=link;
  document.getElementById('link-result').scrollIntoView({behavior:'smooth',block:'nearest'});
  // Mostra sezione prenotazioni
  document.getElementById('bookings-section').style.display='block';
  const emptyBox=document.getElementById('empty-state-box');
  if(emptyBox)emptyBox.style.display='none';
  await loadBookingsForAdmin(date,address);
}

function copyLink(){
  const link=document.getElementById('link-result').dataset.link;
  navigator.clipboard.writeText(link).then(()=>showToast('Link copiato ✓'));
}

function selectSlot(slot,btn){
  if(bookedSlots.includes(slot))return;
  document.querySelectorAll('.slot-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedSlot=slot;
  document.getElementById('step1').classList.replace('active','done');
  document.getElementById('step2').classList.add('active');
  const fs=document.getElementById('form-section');
  fs.style.display='block';
  document.getElementById('slot-badge').style.display='block';
  document.getElementById('slot-time').textContent=slot;
  fs.scrollIntoView({behavior:'smooth',block:'start'});
}

async function submitBooking(){
  const name=document.getElementById('c-name').value.trim();
  const phone=document.getElementById('c-phone').value.trim();
  const email=document.getElementById('c-email').value.trim();
  const people=document.getElementById('c-people').value;
  const notes=document.getElementById('c-notes').value.trim();
  const privacy=document.getElementById('c-privacy').checked;
  if(!name||!phone||!email){alert('Compila i campi obbligatori: nome, telefono ed email.');return;}
  if(!privacy){alert('Devi accettare l\'informativa sulla privacy per procedere.');return;}
  if(!selectedSlot){alert('Seleziona uno slot orario.');return;}

  const d=new Date(dateParam+'T00:00:00');
  const ds=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const btn=document.getElementById('submit-btn');
  btn.disabled=true;
  btn.textContent='Invio in corso...';

  try{
    const fd=new FormData();
    fd.append('access_key',WEB3_KEY);
    fd.append('subject','🏠 Prenotazione Open House – '+selectedSlot+' – '+ds+' – '+name);
    fd.append('from_name',name);
    fd.append('Nome',name);
    fd.append('Telefono',phone);
    fd.append('Email_cliente',email);
    fd.append('Persone',people);
    fd.append('Note',notes||'Nessuna');
    fd.append('Orario',selectedSlot);
    fd.append('Data',ds);
    fd.append('Immobile',addressParam||'–');
    const res=await fetch('https://api.web3forms.com/submit',{method:'POST',body:fd});
    const data=await res.json();

    if(data.success){
      bookedSlots.push(selectedSlot);
      await saveBookedSlots();
      // Salva dati cliente nel KV store
      const clientData={name,phone,email,people,notes:notes||'',slot:selectedSlot,ts:new Date().toISOString()};
      const clientsKey=STORE_KEY+'_clients';
      try{
        const cr=await fetch(KV_BASE+encodeURIComponent(clientsKey));
        let clients=[];
        if(cr.ok){const ct=await cr.text();if(ct&&ct!=='null'&&ct!=='')clients=JSON.parse(ct);}
        clients.push(clientData);
        await fetch(KV_BASE+encodeURIComponent(clientsKey),{method:'POST',body:JSON.stringify(clients)});
      }catch(e){}
      document.querySelectorAll('.slot-btn').forEach(b=>{
        if(b.dataset.slot===selectedSlot){
          b.classList.remove('selected');b.classList.add('booked');
          b.innerHTML='<span class="t">'+selectedSlot+'</span><span class="nd">Non disponibile</span><span class="rq" onclick="requestSlot(\''+selectedSlot+'\',event)">Richiedi →</span>';
        }
      });
      document.getElementById('step2').classList.replace('active','done');
      document.getElementById('step3').classList.add('active','done');
      document.getElementById('form-section').style.display='none';
      document.getElementById('slot-section').style.display='none';
      const sc=document.getElementById('success-card');
      sc.style.display='block';
      document.getElementById('success-msg').innerHTML='Hai prenotato le ore <strong>'+selectedSlot+'</strong> del '+ds+'<br>presso '+addressParam+'.<br><br>A presto, <strong>Mario Mela – RE/MAX Aequitas</strong>';
      sc.scrollIntoView({behavior:'smooth'});
      selectedSlot=null;
    }else{
      btn.disabled=false;btn.textContent='Conferma prenotazione →';
      alert('Errore nell\'invio. Riprova tra poco.');
    }
  }catch(e){
    btn.disabled=false;btn.textContent='Conferma prenotazione →';
    alert('Errore di connessione. Riprova.');
  }
}
